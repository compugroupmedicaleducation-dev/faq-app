<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stel je vraag</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <div class="header">
    <h1>Stel je vraag</h1>

    <div class="theme-toggle-wrapper">
      <span class="theme-label" id="themeLabel">Licht</span>
      <button aria-label="Schakel tussen donker en licht modus" 
              class="theme-toggle" id="themeToggle" type="button">
        <span class="theme-toggle-knob" id="themeIcon">🌙</span>
      </button>
    </div>
  </div>

  <!-- Hint -->
  <div class="hint">
    Begin te typen. We tonen direct <b>suggesties</b> uit de FAQ.
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      📚 Onze database bevat inmiddels <span id="faqCount">0</span> vragen en antwoorden
    </div>
  </div>

  <!-- Search input -->
  <input autofocus id="q" placeholder="Bijv. Hoe voeg ik een gebruiker toe?" type="text" />

  <!-- Chips (suggesties) -->
  <div class="chips" id="chips"></div>

  <!-- Answer -->
  <div class="answer" id="answer" style="display:none">
    <div class="answer-title" id="answerTitle"></div>
    <div id="answerText"></div>
  </div>

  <div class="divider"></div>

  <!-- Actions -->
  <div class="actions">
    <button id="clear">🔄 Opnieuw</button>
    <button class="primary" id="contact">✉️ Vraag niet gevonden? Neem contact op</button>
  </div>

  <div class="muted">💡 Tip: Klik op een suggestie om het antwoord te zien</div>

  <div class="debug" id="dbg" style="display:none"></div>

</div>

<!-- Geen FAQ data meer in de HTML -->
<script src="./app.js"></script>

</body>
</html>

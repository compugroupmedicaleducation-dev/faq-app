<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FAQ</title>

<!-- Externe CSS -->
<link rel="stylesheet" href="./app.css">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XXXXXXX');
</script>

</head>
<body>

<div class="wrap">

    <!-- HEADER -->
    <div class="header">
        <h1>Stel je vraag</h1>

        <div class="theme-toggle-wrapper">
            <span class="theme-label" id="themeLabel">Licht</span>
            <button aria-label="Schakel tussen donker en licht modus" class="theme-toggle" id="themeToggle" type="button">
                <span class="theme-toggle-knob" id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <!-- HINT -->
    <div class="hint">Begin te typen. We tonen direct <b>suggesties</b> uit de FAQ.</div>

    <!-- STATISTIEKEN -->
    <div class="stats">
        <div class="stat">📚 Onze database bevat inmiddels <span id="faqCount">0 </span>vragen en antwoorden</div>
    </div>

    <!-- ZOEKVELD -->
    <input autofocus id="q" placeholder="Bijv. Hoe voeg ik een gebruiker toe?" type="text"/>

    <!-- RESULTATEN -->
    <div class="chips" id="chips"></div>

    <!-- CENTRAAL DISPLAY WORDT NIET MEER GEBRUIKT -->
    <div class="answer" id="answer" style="display:none">
        <div class="answer-title" id="answerTitle"></div>
        <div id="answerText"></div>
    </div>

    <div class="divider"></div>

    <!-- ACTIES -->
    <div class="actions">
        <button id="clear">🔄 Opnieuw</button>
        <button class="primary" id="contact">✉️ Vraag niet gevonden? Neem contact op</button>
    </div>

    <div class="muted">💡 Tip: Klik op een suggestie om het antwoord te zien</div>

    <!-- DEBUG -->
    <div class="debug" id="dbg" style="display:none"></div>

</div>

<script>
/* ================================================================
    DATA INLADEN
================================================================ */
let FAQ = [];

fetch('data.json')
  .then(r => r.json())
  .then(data => {
    FAQ = data;
    buildIndex();
    $faqCount.textContent = FAQ.length;
    renderChips([]);
    console.log("Slimme FAQ geladen met", FAQ.length, "vragen");
  });

/* ================================================================
    DOM ELEMENTEN
================================================================ */
const $q = document.getElementById('q');
const $chips = document.getElementById('chips');
const $clear = document.getElementById('clear');
const $contact = document.getElementById('contact');
const $dbg = document.getElementById('dbg');
const $faqCount = document.getElementById('faqCount');
const $themeToggle = document.getElementById('themeToggle');
const $themeLabel = document.getElementById('themeLabel');
const $themeIcon = document.getElementById('themeIcon');

let debugMode = false;
let INDEX = [];

/* ================================================================
    THEME HANDLING
================================================================ */

function detectInitialTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'light' || saved === 'dark') return saved;

  return window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches
    ? 'dark'
    : 'light';
}

function applyTheme(theme) {
  if (theme === 'dark') {
    document.body.classList.add('dark');
    $themeIcon.textContent = '🌞';
    $themeLabel.textContent = 'Donker';
  } else {
    document.body.classList.remove('dark');
    $themeIcon.textContent = '🌙';
    $themeLabel.textContent = 'Licht';
  }
}

let currentTheme = detectInitialTheme();
applyTheme(currentTheme);

$themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', currentTheme);
  applyTheme(currentTheme);
});

/* ================================================================
    INDEX OPBOUWEN (slim zoeken)
================================================================ */
function normalize(text) {
  if (!text) return '';
  return String(text)
    .toLowerCase()
    .normalize('NFD')
    .replace(/\p{Diacritic}/gu, '') 
    .trim();
}

function buildIndex() {
  INDEX = FAQ.map(item => {
    const vraagNorm = normalize(item.vraag);
    const antwoordNorm = normalize(item.antwoord);

    const kwJoined = Array.isArray(item.keywords)
      ? item.keywords.join(' ; ')
      : String(item.keywords || '');

    const kwNorm = normalize(kwJoined);

    const kwTokens = kwNorm
      .split(/[;,\s]+/)
      .map(s => s.trim())
      .filter(Boolean);

    const allText = vraagNorm + ' ' + antwoordNorm + ' ' + kwNorm;

    // foutcodes detecteren
    const codeMatches = kwJoined.match(/\b\d{4,6}\b/g) || [];
    const codes = Array.from(new Set(codeMatches.map(c => c.trim())));

    return {
      raw: item,
      vraagNorm,
      antwoordNorm,
      kwTokens,
      allText,
      codes
    };
  });

  if (debugMode) {
    $dbg.textContent =
      "Debug mode actief\nFAQ items: " +
      FAQ.length +
      "\n\nEerste item:\n" +
      JSON.stringify(FAQ[0], null, 2);
  }
}

/* ================================================================
    SLIMME MATCHING
================================================================ */
function getSuggestions(query, limit = 6) {
  const normalizedQuery = normalize(query);

  if (!normalizedQuery || normalizedQuery.length < 2) {
    if (debugMode) $dbg.textContent = "Query te kort (min. 2 karakters)";
    return [];
  }

  if (!INDEX.length) return [];

  const tokens = normalizedQuery.split(/\s+/).filter(t => t.length >= 2);
  const numericCodesInQuery = normalizedQuery.match(/\b\d{4,6}\b/g) || [];

  const scored = INDEX.map(entry => {
    let score = 0;
    let matches = [];

    numericCodesInQuery.forEach(code => {
      if (entry.codes.includes(code) || entry.allText.includes(code)) {
        score += 25;
        matches.push('foutcode: ' + code);
      }
    });

    tokens.forEach(t => {
      const isNumeric = /^\d+$/.test(t);
      if (isNumeric) return;

      if (entry.kwTokens.includes(t)) {
        score += 8;
        matches.push("kw: " + t);
      } else if (entry.kwTokens.some(kw => kw.includes(t))) {
        score += 4;
        matches.push("kw~: " + t);
      }

      if (entry.vraagNorm.includes(t)) {
        score += 3;
        matches.push("vraag: " + t);
      }

      if (entry.antwoordNorm.includes(t)) {
        score += 1;
        matches.push("antwoord: " + t);
      }
    });

    if (tokens.length > 1 && matches.length >= tokens.length) {
      score += 5;
    }

    return { row: entry.raw, score, matches };
  });

  const results = scored
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);

  if (debugMode) {
    $dbg.textContent =
      'Gevonden: ' + results.length + ' suggesties\n\n' +
      results.map(r =>
        "Score " +
        r.score.toFixed(1) +
        ": " +
        r.row.vraag +
        "\n  → " +
        r.matches.join(", ")
      ).join("\n\n");
  }

  return results.map(x => x.row);
}

/* ================================================================
    CHIP + ANTWOORD (onder chip)
================================================================ */
function renderChips(list) {
  $chips.innerHTML = '';

  if (list.length === 0) {
    const span = document.createElement('div');
    span.className = 'muted';
    span.textContent = 'Geen suggesties gevonden…';
    $chips.appendChild(span);
    return;
  }

  list.forEach(row => {
    const container = document.createElement('div');
    container.style.width = '100%';

    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = '💡 ' + row.vraag;
    chip.title = 'Klik om het antwoord te zien';

    const answerBox = document.createElement('div');
    answerBox.className = 'answer';
    answerBox.style.display = 'none';

    const answerTitle = document.createElement('div');
    answerTitle.className = 'answer-title';
    answerTitle.textContent = row.vraag;

    const answerText = document.createElement('div');
    answerText.innerHTML = row.antwoord || 'Geen antwoord beschikbaar.';

    answerBox.appendChild(answerTitle);
    answerBox.appendChild(answerText);

    chip.addEventListener('click', () => {
      document.querySelectorAll('.answer').forEach(a => {
        if (a !== answerBox) a.style.display = 'none';
      });

      answerBox.style.display =
        answerBox.style.display === 'none' ? 'block' : 'none';
    });

    container.appendChild(chip);
    container.appendChild(answerBox);
    $chips.appendChild(container);
  });
}

/* ================================================================
    INPUT HANDLING
================================================================ */
let debounceTimer;

$q.addEventListener('input', () => {
  clearTimeout(debounceTimer);

  debounceTimer = setTimeout(() => {
    const suggestions = getSuggestions($q.value);
    renderChips(suggestions);
  }, 200);
});

$clear.addEventListener('click', () => {
  $q.value = '';
  $chips.innerHTML = '';
  $q.focus();
});

/* ================================================================
    CONTACT BUTTON
================================================================ */
$contact.addEventListener('click', () => {
  const question = $q.value.trim();
  const subject = "FAQ Vraag: " + (question || "Nieuwe vraag");
  const body = question ? "Mijn vraag:\n\n" + question : "";

  window.location.href =
    "mailto:support@compufit-be.cgm.com?subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(body);
});

/* ================================================================
    DEBUGMODUS
================================================================ */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'd') {
    e.preventDefault();
    debugMode = !debugMode;
    $dbg.style.display = debugMode ? 'block' : 'none';
  }
});

</script>

</body>
</html>
